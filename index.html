<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f2a20">
  <meta name="description" content="Salon 8 - Jeu de billard 8-ball dans le navigateur : local, contre l'ordinateur ou en ligne.">
  <link rel="icon" type="image/svg+xml" href="/8-ball-pool/favicon.svg">
  <title>Salon 8</title>
</head>
<body>
  <button id="admin-secret" type="button" aria-label="Ouvrir le mode administration"></button>
  <div id="top"><div class="pc" id="p0"></div><div id="tm"><span>30</span></div><div class="pc" id="p1"></div></div>
  <div id="mid"><aside><div id="gauge"><i id="gf"></i><b id="gp">55</b></div><div id="spin" title="Effet"><i id="sd"></i></div></aside><canvas id="c"></canvas><div id="rack"></div></div>
  <p id="hint">Sur mobile : vise, tire en arrière, relâche pour jouer.</p>
  <div id="bar">
    <span id="msg"></span>
    <span id="deg"></span>
    <button id="undo" type="button">Annuler le coup</button>
    <button id="fire" type="button">Tirer</button>
    <button id="mn" type="button">Pause</button>
  </div>
  <div id="menu" class="ov"><div id="pf"></div><div class="card"></div></div>
  <div id="dlg" class="ov" style="display:none"><div class="card"></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
